<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админка товаров</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <main class="admin-page">
        <header class="admin-header">
            <div>
                <h1>Админка товаров</h1>
                <p>CRUD для товаров через localStorage</p>
            </div>
            <div class="admin-header-actions">
                <a href="../index.html">Открыть сайт</a>
                <button type="button" data-reset-products>Сбросить товары</button>
            </div>
        </header>

        <div class="admin-notice">
            Товары сохраняются в localStorage браузера. Если удалить товар здесь, он сразу пропадет на главной странице в этом же браузере.
        </div>

        <section class="admin-form-card">
            <h2 data-form-title>Добавить товар</h2>
            <form class="product-form" data-product-form>
                <input type="hidden" name="id">

                <label>
                    Блок товара
                    <select name="group" required>
                        <option value="new">Новинки</option>
                        <option value="emotion">ROYCE EMOTIONAL</option>
                        <option value="sense">ROYCE SENSE</option>
                        <option value="enjoy">ROYCE ENJOY</option>
                    </select>
                </label>

                <label>
                    Название товара
                    <input type="text" name="title" required>
                </label>

                <label>
                    Характеристики
                    <input type="text" name="meta" required>
                </label>

                <label>
                    Цена
                    <input type="number" name="price" min="0" step="1" required>
                </label>

                <label>
                    Старая цена
                    <input type="number" name="oldPrice" min="0" step="1">
                </label>

                <label>
                    Единица измерения
                    <input type="text" name="unit" value="м²">
                </label>

                <label>
                    Основная картинка: путь
                    <input type="text" name="image" placeholder="new-light.png или uploads/photo.jpg">
                </label>

                <label>
                    Основная картинка: загрузить файл
                    <input type="file" name="imageFile" accept="image/*">
                    <span>Файл будет сохранен в localStorage как base64.</span>
                </label>

                <label>
                    Вторая картинка: путь
                    <input type="text" name="imageHover" placeholder="new-light.png или uploads/photo-hover.jpg">
                </label>

                <label>
                    Вторая картинка: загрузить файл
                    <input type="file" name="imageHoverFile" accept="image/*">
                    <span>Для приближенной картинки карточки товара.</span>
                </label>

                <label>
                    Порядок вывода
                    <input type="number" name="sortOrder" value="0">
                </label>

                <div class="checkboxes">
                    <label>
                        <input type="checkbox" name="isActive" checked>
                        Показывать на сайте
                    </label>
                </div>

                <div class="form-actions">
                    <button type="submit" data-submit-button>Добавить товар</button>
                    <button type="button" data-cancel-edit class="secondary" hidden>Отмена</button>
                </div>
            </form>
        </section>

        <section class="admin-table-card">
            <div class="table-top">
                <h2>Список товаров</h2>
                <div class="filters" data-filters>
                    <button type="button" data-filter="all" class="active">Все</button>
                    <button type="button" data-filter="new">Новинки</button>
                    <button type="button" data-filter="emotion">ROYCE EMOTIONAL</button>
                    <button type="button" data-filter="sense">ROYCE SENSE</button>
                    <button type="button" data-filter="enjoy">ROYCE ENJOY</button>
                </div>
            </div>

            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Фото</th>
                            <th>Блок</th>
                            <th>Название</th>
                            <th>Цена</th>
                            <th>Старая цена</th>
                            <th>Дата</th>
                            <th>Статус</th>
                            <th>Порядок</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody data-products-table></tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="../assets/js/products-storage.js"></script>
    <script src="admin.js"></script>
</body>
</html>
